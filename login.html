<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Smitha Classes</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/dashboard.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-left">

        <div class="login-logo">
            <i class="fa-solid fa-graduation-cap"></i>
            Smitha Classes
        </div>

        <h1>
            Welcome Back! 👋
        </h1>

        <p>
            Access your Smitha Classes management dashboard
            and manage your academic activities.
        </p>

        <div class="login-benefits">

            <div>
                <i class="fa-solid fa-users"></i>
                Student Management
            </div>

            <div>
                <i class="fa-solid fa-chart-line"></i>
                Academic Analytics
            </div>

            <div>
                <i class="fa-solid fa-calendar-check"></i>
                Attendance Tracking
            </div>

        </div>

    </div>


    <div class="login-box">

        <div class="login-icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h2>Sign In</h2>

        <p>Enter your details to continue</p>

        <form onsubmit="loginUser(event)">

            <label>Email Address</label>

            <div class="input-group">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@example.com"
                    required>

            </div>


            <label>Password</label>

            <div class="input-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>


            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>


            <button class="login-submit">
                Login
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <p class="demo-login">
            Demo: admin@smithaclasses.com / 123456
        </p>

        <a href="index.html" class="back-home">
            ← Back to Website
        </a>

    </div>

</div>


<script>

function loginUser(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (
        (email === "admin@smithaclasses.com" ||
         email === "admin@example.com")
        && password === "123456"
    ) {

        localStorage.setItem("loggedIn", "true");

        window.location.href = "dashboard.html";

    } else {

        alert(
            "Invalid login!\n\nDemo Login:\nEmail: admin@smithaclasses.com\nPassword: 123456"
        );

    }

}

</script>

</body>
</html>
