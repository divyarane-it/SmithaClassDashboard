<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xwfzfmvnqklwykkjfbkl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_2wfoAwTlLbD_l6yQWiGvCg_x5TE02Dt";

const ADMIN_USER_ID = "9563f9b3-9893-45d1-ad4c-03b929f693a4";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("show");
}

async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
}

// Check admin login before accessing student records
async function checkAdmin() {
    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user || data.user.id !== ADMIN_USER_ID) {
        await supabaseClient.auth.signOut();
        window.location.href = "login.html";
        return false;
    }

    return true;
}

// Load student records from Supabase
async function loadStudents() {
    const tbody = document.getElementById("studentRows");

    tbody.innerHTML =
        '<tr><td colspan="6">Loading students...</td></tr>';

    const { data, error } = await supabaseClient
        .from("students")
        .select("id, student_name, student_class, parent_name, phone, status")
        .order("id", { ascending: true });

    if (error) {
        tbody.innerHTML =
            '<tr><td colspan="6">Could not load students: ' +
            escapeHTML(error.message) + '</td></tr>';
        return;
    }

    if (!data || data.length === 0) {
        tbody.innerHTML =
            '<tr><td colspan="6">No students added yet.</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(student => {
        const statusClass = {
            Active: "active-status",
            Pending: "pending-status",
            Inactive: "inactive-status"
        }[student.status] || "";

        return `
            <tr>
                <td>STU${String(student.id).padStart(3, "0")}</td>
                <td>${escapeHTML(student.student_name)}</td>
                <td>${escapeHTML(student.student_class)}</td>
                <td>${escapeHTML(student.parent_name || "-")}</td>
                <td>${escapeHTML(student.phone || "-")}</td>
                <td>
                    <span class="status ${statusClass}">
                        ${escapeHTML(student.status)}
                    </span>
                </td>
            </tr>
        `;
    }).join("");

    searchStudents();
}

// Prevent database text from being interpreted as HTML
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

// Add a student to the database
async function addStudent() {
    const name = prompt("Enter student name:");
    if (!name || !name.trim()) return;

    const studentClass = prompt(
        "Enter class (example: Grade 8):"
    );
    if (!studentClass || !studentClass.trim()) return;

    const parent = prompt("Enter parent name (optional):");
    const phone = prompt("Enter phone number (optional):");

    const statusInput = prompt(
        "Enter status: Active, Pending, or Inactive",
        "Active"
    );

    if (statusInput === null) return;

    const status = statusInput.trim().toLowerCase();
    const validStatuses = {
        active: "Active",
        pending: "Pending",
        inactive: "Inactive"
    };

    if (!validStatuses[status]) {
        alert("Please enter Active, Pending, or Inactive.");
        return;
    }

    const { error } = await supabaseClient
        .from("students")
        .insert({
            student_name: name.trim(),
            student_class: studentClass.trim(),
            parent_name: parent?.trim() || null,
            phone: phone?.trim() || null,
            status: validStatuses[status]
        });

    if (error) {
        alert("Could not add student: " + error.message);
        return;
    }

    alert("Student added successfully!");
    await loadStudents();
}

// Search students and filter by class
function searchStudents() {
    const search = document
        .getElementById("studentSearch")
        .value.toLowerCase().trim();

    const grade = document
        .getElementById("classFilter")
        .value.toLowerCase().trim();

    document.querySelectorAll("#studentRows tr").forEach(row => {
        const text = row.innerText.toLowerCase();
        const matchesSearch = text.includes(search);
        const matchesGrade =
            !grade || row.cells[2]?.innerText.toLowerCase() === grade;

        row.style.display =
            matchesSearch && matchesGrade ? "" : "none";
    });
}

// Start only after confirming the admin session
(async function initStudentsPage() {
    const allowed = await checkAdmin();

    if (allowed) {
        await loadStudents();
    }
})();
</script>
</body>
